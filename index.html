<!DOCTYPE html>
<html lang="zh-HK" class="scroll-smooth">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>永明彩虹強積金智能投顧系統</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.8/dist/katex.min.css">
  <script src="https://cdn.jsdelivr.net/npm/katex@0.16.8/dist/katex.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/katex@0.16.8/dist/contrib/auto-render.min.js"></script>
  <style>
    body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
    .custom-scrollbar::-webkit-scrollbar { width: 6px; }
    .custom-scrollbar::-webkit-scrollbar-thumb { background: rgba(245, 158, 11, 0.2); border-radius: 99px; }
  </style>
</head>
<body class="bg-slate-950 text-slate-100 min-h-screen">
  <div class="flex items-center justify-center min-h-screen">
    <div class="text-center p-6">
      <h1 class="text-2xl font-black text-white mb-4">系統啟動中...</h1>
      <p class="text-slate-400">正在加載永明彩虹強積金配置算法</p>
    </div>
  </div>

  <script>
    // 確保 DOM 加載完畢後顯示內容
    window.onload = () => {
      document.body.innerHTML = `
        <div class="p-8 text-center">
            <h1 class="text-3xl font-bold text-amber-500">系統已就緒</h1>
            <p class="mt-4 text-slate-300">請透過電腦端進行詳細配置，手機端顯示優化中。</p>
        </div>
      `;
      // 這裡您可以放回您原本的完整內容
      console.log("System initialized successfully.");
    };
  </script>
</body>
</html>
